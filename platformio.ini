; PlatformIO-Projekt. Der Code liegt im Ordner led_decke_esp32/ und lässt sich
; genauso mit der Arduino IDE öffnen (led_decke_esp32.ino).
[platformio]
src_dir = led_decke_esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Standard-Aufteilung lassen: über WLAN (OTA) lässt sie sich nicht ändern
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^2.1.0
